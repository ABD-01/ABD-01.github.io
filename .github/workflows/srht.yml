name: Publish to SourceHut

on:
  push:
    branches:
      - version5

  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './package-lock.json'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Package build
        run: |
          cd dist
          tar -czf ../site.tar.gz *

      - name: Publish to SourceHut
        env:
          SRHT_TOKEN: ${{ secrets.SRHT_TOKEN }}
          DOMAIN: "muhammed.srht.site"
          PAGES_API: "https://pages.sr.ht/query"
          FILE: "site.tar.gz"
        run: |
          if [ -z "$SRHT_TOKEN" ]; then
            echo "Error: SRHT_TOKEN is not set. Please add it to your GitHub Repository Secrets."
            exit 1
          fi

          curl --fail --show-error "$PAGES_API" \
            -H "Authorization: Bearer $SRHT_TOKEN" \
            -F "operations={\"query\":\"mutation(\$domain: String!, \$content: Upload!) { publish(domain: \$domain, content: \$content) { domain } }\",\"variables\":{\"domain\":\"$DOMAIN\",\"content\":null}}" \
            -F 'map={ "0": ["variables.content"] }' \
            -F "0=@$FILE"
