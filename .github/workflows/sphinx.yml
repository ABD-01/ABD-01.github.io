name: Docs
on:
  push:
    branches: [sphinx]

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          # token: ${{ secrets.PAT_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependecies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install exts/ablog
          pip install ghp-import

      - name: Fetch READMEs from external repos
        run: |
          curl -sSL https://raw.githubusercontent.com/ABD-01/quantum-harmony/master/README.md -o quantum-harmony.md
          curl -sSL https://raw.githubusercontent.com/ABD-01/log-analysis/master/README.md -o log-analysis.md
          curl -sSL https://raw.githubusercontent.com/ABD-01/py2048/master/README.md -o py2048.md
          curl -sSL https://raw.githubusercontent.com/ABD-01/esp32-guru-upload/master/README.md -o esp32-coredump-upload.md

      - name: Build docs
        run: 
          sphinx-build . _build -v -b dirhtml

      - name: Run ghp-import
        run: |
          git config user.name ABD-01
          git config user.email 63636498+ABD-01@users.noreply.github.com
          ghp-import -n -m "auto-generating sphinx docs" -p -f -o _build
